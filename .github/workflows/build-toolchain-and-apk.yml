name: Build XenonDroidCC (toolchain + APK)

# Manual trigger + on every push. This is the "no PC needed" part:
# everything below runs on GitHub's Linux runners. You just download
# the finished APK from the Actions run's artifacts / a Release.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-toolchain:
    # Stage 1: cross-build binutils+gcc so the HOST is Android/ARM64
    # and the TARGET is powerpc-xenon-elf. This is the part most
    # likely to need real debugging — patch versions/flags here as
    # build errors come up, this is a starting point, not a
    # guaranteed-green build.
    runs-on: ubuntu-latest
    steps:
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential texinfo bison flex \
            libgmp-dev libmpfr-dev libmpc-dev wget git python3

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Fetch libxenon (the toolchain build script lives inside it —
              there is no separate Free60Project/xenon-toolchain repo)
        run: |
          git clone --depth 1 https://github.com/Free60Project/libxenon.git

      - name: Patch build-xenon-toolchain to target an Android-ARM64 host
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # The stock script (libxenon/toolchain/build-xenon-toolchain)
          # downloads binutils/gcc/gmp/mpfr/mpc itself and configures
          # them for a normal Linux host. We inject --host + CC into
          # every "configure --target=$TARGET" line it runs, so the
          # resulting binutils/gcc binaries run ON Android/ARM64 while
          # still emitting powerpc-xenon-elf code. This is the guess
          # that most likely needs adjusting based on the real error
          # output — the script was never written with this in mind.
          ANDROID_CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          cd libxenon/toolchain
          sed -i \
            "s|configure --target=\$TARGET|configure --target=\$TARGET --host=aarch64-linux-android CC=$ANDROID_CC|g" \
            build-xenon-toolchain

      - name: Run build-xenon-toolchain
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          PREFIX: ${{ github.workspace }}/xenon-android-toolchain
        run: |
          cd libxenon/toolchain
          chmod +x build-xenon-toolchain
          # PREFIX (env above) overrides the script's default
          # /usr/local/xenon so no sudo is needed on the runner.
          ./build-xenon-toolchain toolchain
        continue-on-error: true # expected to need real iteration first run

      - name: Package toolchain artifact
        run: |
          mkdir -p out
          tar -czf out/xenon-android-toolchain.tar.gz -C "${{ github.workspace }}" xenon-android-toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: xenon-android-toolchain
          path: out/xenon-android-toolchain.tar.gz

  build-apk:
    needs: build-toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: xenon-android-toolchain
          path: app/src/main/assets/toolchain-raw

      - name: Unpack toolchain into app assets
        run: |
          cd app/src/main/assets/toolchain-raw
          tar -xzf xenon-android-toolchain.tar.gz
          rm xenon-android-toolchain.tar.gz

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: XenonDroidCC-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
